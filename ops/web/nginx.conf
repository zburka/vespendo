server {
  listen 80;
  server_name _;
  root /srv/dist;
  index index.html;
  client_max_body_size 25m;          # nyugtaképek és banki kivonatok base64-ben

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # a webhook hívások ugyanarról az eredetről mennek az n8n-hez (nincs CORS), hosszú műveletek is lefuthatnak
  location /webhook/ {
    proxy_pass http://n8n:5678/webhook/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # belépés, fiók- és háztartás-kezelés, adatok: a belépési kapu (vespendo-auth) – a valódi kliens-IP a Cloudflare fejlécéből jön
  # (a kapu ezt használja a belépési kísérletek korlátozásához; hiányában az nginx címe)
  location /api/ {
    proxy_pass http://vespendo-auth:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "no-store" always;
  }

  # a hash-elt, változatlan fájlok hosszan gyorsítótárazhatók
  location /_expo/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /assets/       { expires 30d; add_header Cache-Control "public"; }

  # a HTML és a manifeszt mindig friss: a módosítások a következő megnyitáskor megjelennek
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

  # dinamikus útvonal (tétel szerkesztő)
  location ~ ^/tranzakcio/[^/]+$ {
    add_header Cache-Control "no-cache";
    try_files /tranzakcio/[id].html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
